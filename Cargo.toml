[package]
name = "lab-browser"
version = "0.1.0"
description = "DB-aware companion app for Raw-Plot"
edition = "2021"
default-run = "lab-browser-native"

[lib]
name = "lab_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lab-browser-native"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
core-foundation = "0.10"
core-graphics = "0.25"
png = "0.17"
foreign-types = "0.5"
